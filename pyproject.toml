[project]
name = "sentinelai"
version = "0.0.1"
description = "End-to-end multimodal content moderation system"
requires-python = ">=3.10"
# Runtime deps that are hardware-independent. PyTorch is installed separately by
# scripts/setup-env.sh because its wheel index differs between CPU and CUDA hosts.
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelai"]
