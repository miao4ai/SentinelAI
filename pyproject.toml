[project]
name = "sentinelai"
version = "0.0.1"
description = "End-to-end multimodal content moderation system"
requires-python = ">=3.10"
# Runtime deps that are hardware-independent. PyTorch is installed separately by
# scripts/setup-env.sh because its wheel index differs between CPU and CUDA hosts.
dependencies = [
    "numpy>=1.24",
    # AST (audio expert) ships via HuggingFace Transformers. torch/torchvision/
    # torchaudio are still installed separately by scripts/setup-env.sh.
    "transformers>=4.40",
    # SentencePiece backs the XLM-R / DeBERTa tokenizers used by the text expert.
    "sentencepiece>=0.1.99",
    # scikit-learn powers the fusion-depth comparison (decision tree + MLP, CPU).
    "scikit-learn>=1.3",
    # PyTorch Lightning drives the cross-attention training loop (V2 ch.6.3).
    "lightning>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelai"]
